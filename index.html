<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Survey Form</title>
</head>

<body>

    <h1 id="title">Student Feedback Survey</h1>

    <p id="description">
        Please fill out this survey to help us improve our learning experience.
    </p>

    <form id="survey-form">

        <label id="name-label" for="name">Name</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

        <label id="email-label" for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label id="number-label" for="number">Age</label><br>
        <input type="number" id="number" name="age" placeholder="Enter your age" min="10" max="100">
        <br><br>

        <label for="dropdown">What is your current role?</label><br>
        <select id="dropdown" name="role">
            <option value="student">Student</option>
            <option value="developer">Developer</option>
            <option value="other">Other</option>
        </select>

        <br><br>

        <p>Would you recommend our platform?</p>

        <input type="radio" name="recommend" value="yes"> Yes<br>
        <input type="radio" name="recommend" value="no"> No<br>
        <input type="radio" name="recommend" value="maybe"> Maybe

        <br><br>

        <p>What topics are you interested in?</p>

        <input type="checkbox" value="html"> HTML<br>
        <input type="checkbox" value="css"> CSS<br>
        <input type="checkbox" value="javascript"> JavaScript<br>

        <br><br>

        <p>Additional Comments:</p>

        <textarea placeholder="Write your comments here..."></textarea>

        <br><br>

        <button id="submit" type="submit">Submit</button>

    </form>

</body>

</html>
